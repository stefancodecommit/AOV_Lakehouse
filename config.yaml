# Settings for the CBS/KVK lakehouse. Read by pipeline/common/config.py.
#
# Override per machine in config.local.yaml (same structure, only the keys you change;
# not in git), or with environment variables: LAKEHOUSE__<SECTION>__<KEY>, e.g.
#   LAKEHOUSE__CBS__START_YEAR=2022
#   LAKEHOUSE__PATHS__LAKEHOUSE=/data/lakehouse
#   LAKEHOUSE__OLLAMA__HOST=http://ollama:11434
# Values from environment variables are read as YAML, so 2022 is a number and
# "[KW, JJ]" a list. LAKEHOUSE_CONFIG=<file> uses another file instead of this one.
# Order: config.yaml < config.local.yaml < environment. Unknown keys are an error.
#
# Relative paths are relative to this file's folder.

paths:
  lakehouse: lakehouse            # bronze/, silver/, gold/ live here
  inbox: inbox                    # uploads and downloaded files (KVK zip, reference files)

cbs:
  base_url: https://opendata.cbs.nl/ODataApi/odata
  start_year: 2020                # first year ingested for the data tables
  period_preference: [KW, JJ]     # quarters if a table has them, else years
  pause_seconds: 0.25             # pause between API requests (be polite to CBS)
  # Data tables: their TypedDataSet is requested one period at a time (incremental).
  tables:
    - 86009NED   # absence survey: share absent, frequency, duration, causes (yearly)
    - 80072NED   # absence percentage per sector and size class (quarterly)
    - 83130NED   # earlier absence survey, 2014-2023 (stopped by CBS)
    - 81644NED   # establishments per sector and region (yearly)
    - 81589NED   # businesses per sector, size class and legal form (quarterly)
  # Code lists and metadata: one small request each, made once.
  # To refresh one later: python -m pipeline.bronze.cbs --only <name> --force
  # "<table>" alone is the table's service root (its list of entity sets).
  metadata:
    - 86009NED/Bedrijfskenmerken
    - 86009NED/CategoryGroups
    - 86009NED/Marges
    - 86009NED/DataProperties
    - 86009NED/Perioden
    - 83130NED/Bedrijfskenmerken
    - 83130NED/CategoryGroups
    - 83130NED/Marges
    - 83130NED/DataProperties
    - 83130NED/Perioden
    - 80072NED/BedrijfskenmerkenSBI2008
    - 80072NED/CategoryGroups
    - 80072NED/DataProperties
    - 80072NED/Perioden
    - 81589NED
    - 81589NED/Perioden
    - 81589NED/BedrijfstakkenBranchesSBI2008
    - 81589NED/DataProperties
    - 81644NED/BedrijfstakkenBranchesSBI2008
    - 81644NED/RegioS
    - 81644NED/DataProperties
    - 81644NED/Perioden

kvk:
  dataset_page: https://www.kvk.nl/producten-bestellen/kvk-handelsregister-open-data-set/
  download_url: https://www.kvk.nl/download/kvk-open-dataset-basis-bedrijfsgegevens.zip
  max_malformed_share: 0.001      # reject a file when more rows have a wrong field count
  max_snapshot_age_days: 45       # freshness warning when the newest KVK upload is older
  # Logical column -> accepted header spellings, compared after lower-casing and removing
  # everything that isn't a letter or digit ("Datum aanvang" == "datumaanvang").
  required_columns:
    start_date: [datumaanvang, startdatum]
    active: [actief, indicatieactief]
    legal_form: [rechtsvormcode, rechtsvorm]
    postcode_region: [postcoderegio, postcode]
  # Real file (2026-10): "SBI activiteiten" = all codes, "Hoofdactiviteiten" = main
  # code(s); both comma-separated lists within one row per company.
  optional_columns:
    insolvency: [insolventiecode, insolventie]
    sbi: [sbiactiviteiten, sbicode, sbi, activiteiten]
    main_activity: [hoofdactiviteiten, hoofdactiviteit]
    member_state: [lidstaat]

reference:
  # CBS crosswalk SBI 2008 -> SBI 2025. For a newer version: change the URL, or run
  # python -m pipeline.bronze.reference --url <url>
  sbi_crosswalk_url: https://www.cbs.nl/-/media/cbs/onze-diensten/methoden/classificaties/documents/2026/schakelschema-sbi2008sbi2025-v20.xlsx

ollama:
  host: http://localhost:11434
  model: qwen2.5:7b               # any model that supports tool calling

dashboard:
  # Logo at the top of the sidebar (png, jpg or svg), with a variant for dark mode.
  # Shown only when the file exists; otherwise project_note is shown as text. Logo files
  # are not in git (see .gitignore): a university logo is a trademark, so check the
  # brand guidelines before publishing it.
  logo: dashboard/assets/eur_logo.svg
  logo_dark: dashboard/assets/eur_logo_dark.svg
  project_note: Erasmus University Rotterdam

gold:
  # The risk index (pipeline/gold/build.py, gold_risk_index): relative absence risk per
  # sector and size class, compared with the national figure.
  risk_index:
    window_quarters: 8          # quarters for the band and the trend (2 years)
    min_quarters: 4             # fewer quarters with figures: no assessment
    rising_per_year: 0.05       # trend above +0.05 per year: rising; below -0.05: falling

schedules:
  # When Dagster runs the jobs (cron: minute hour day-of-month month day-of-week), in
  # this time zone. Only while Dagster runs (dagster dev, or docker compose up).
  timezone: Europe/Amsterdam
  cbs_ingest: "0 6 1 * *"        # 1st of the month 06:00: CBS + SBI crosswalk
  freshness: "0 9 1 * *"         # 1st of the month 09:00: freshness warnings
  maintenance: "0 3 15 * *"      # 15th 03:00: quarantine, KVK retention, log retention, vacuum, backup

delta:
  # tools/maintenance.py (monthly) deletes Parquet files that no table version younger than
  # this still needs; older versions can't be read ("time travel") after that.
  vacuum_retention_hours: 168     # 7 days

quarantine:
  # tools/maintenance.py (monthly) removes entries that are resolved (ingested later) and
  # entries older than this; a problem that still exists is quarantined again next run.
  retention_days: 90

retention:
  # Personal data in logs (risk R10, docs/privacy_and_risks.md), applied by the monthly
  # maintenance (tools/maintenance.py, orchestration/definitions.py).
  confirmed_by_days: 365          # KVK upload log: who confirmed a load is removed after this
  dagster_runs_days: 180          # Dagster runs older than this are deleted (with their logs),
                                  # except a run that holds an asset's latest result

backup:
  # tools/backup.py (monthly, in the maintenance job): lakehouse/ and inbox/kvk/ as one
  # archive (risk R14). Relative to this file's folder; for a real backup, point it at
  # another disk, e.g. in config.local.yaml.
  path: backups
  keep: 3                         # newest archives kept; older ones are removed
  # true: refuse to back up when backup.path is on the same disk as the lakehouse (e.g.
  # a USB drive that isn't plugged in, so its folder would land on the internal disk).
  # false: back up anyway, with a warning (the default while there is no second disk)
  require_other_disk: false

# Still to add when they are built (see TODO.md): alert targets (FR-19).
