# CI: run the test suite on every push and pull request, then check that the Docker
# image still builds (it is not pushed anywhere).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:          # also allows a manual run from the Actions tab

permissions:
  contents: read              # the job only needs to read the code

concurrency:                  # a newer push cancels the older run on the same branch
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04         # pinned, like the packages: move to a newer Ubuntu on purpose
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip                          # reuse downloaded packages between runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -m "not live"            # live CBS tests stay off in CI

  docker-build:
    needs: pytest                 # only when the tests passed
    runs-on: ubuntu-24.04         # pinned, like the packages: move to a newer Ubuntu on purpose
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg CODE_VERSION=${GITHUB_SHA::7} -t cbs-kvk-lakehouse:ci .

      - name: Smoke test - the code loads inside the image
        run: |
          docker run --rm cbs-kvk-lakehouse:ci python -c "import pipeline.bronze.cbs, pipeline.silver.cbs, pipeline.gold.build, pipeline.silver.kvk, pipeline.common.publish, pipeline.common.runlog"
          # without DAGSTER_HOME: validating needs no Postgres (it uses a temporary folder)
          docker run --rm cbs-kvk-lakehouse:ci env -u DAGSTER_HOME dagster definitions validate -f orchestration/definitions.py
